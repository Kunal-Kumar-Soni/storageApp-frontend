name: Deploy StorageApp Frontend

on: [push, workflow_dispatch]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      S3_BUCKET_NAME: kunal-storageapp-frontend
      VITE_GOOGLE_CLIENT_ID: 754657210662-r76ttct0cjaq8fradlpobothme2t49uf.apps.googleusercontent.com
      VITE_BACKEND_BASE_URL: https://dev.kunalkumarsoni.in
      VITE_RAZORPAY_KEY: rzp_test_Tb83TYCyWoD6Ob

    steps:
      - name: Clone frontend repository
        run: git clone https://github.com/Kunal-Kumar-Soni/storageApp-frontend.git .

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3
        run: aws s3 sync dist/ "s3://${S3_BUCKET_NAME}/" --delete

      - name: Deployment complete
        run: echo "Frontend Deployed Successfully..."
